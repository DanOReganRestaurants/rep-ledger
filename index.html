<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Gym programmes for size or strength, with logging, progression prompts and progress charts.">
<meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rep Ledger">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Rep Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: single-column training log, phone-first; fixed bottom tab bar; cards only for exercises */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#e3e8ee; --ink:#14181e; --muted:#5a6472; --line:#d3d9e1;
  --accent:#1f5bc4; --accent-ink:#ffffff; --accent-soft:#dfe8f8;
  --good:#1b7a4a; --good-soft:#dcf1e5; --warn:#a15f00; --warn-soft:#fbecd2; --bad:#b0271f; --bad-soft:#f8dedb;
  --p25:#d32f2f; --p20:#1e5bd8; --p15:#f0bf2a; --p10:#2e9a4b; --p5:#f2f2f2; --p25s:#262626; --p125:#b8bec6;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1216; --surface:#181c22; --sunk:#12161b; --ink:#e7ebf0; --muted:#98a2b0; --line:#2a3039;
  --accent:#6b9fff; --accent-ink:#0b1424; --accent-soft:#1c2a44;
  --good:#4fc28a; --good-soft:#15301f; --warn:#f0b14a; --warn-soft:#352812; --bad:#ff7b72; --bad-soft:#3a1c1a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1216; --surface:#181c22; --sunk:#12161b; --ink:#e7ebf0; --muted:#98a2b0; --line:#2a3039;
  --accent:#6b9fff; --accent-ink:#0b1424; --accent-soft:#1c2a44;
  --good:#4fc28a; --good-soft:#15301f; --warn:#f0b14a; --warn-soft:#352812; --bad:#ff7b72; --bad-soft:#3a1c1a;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(150px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:1.6rem;text-transform:uppercase}
h2{font-size:1.5rem;text-transform:uppercase}
h3{font-size:1.25rem}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header.top{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;margin-bottom:12px}
.status{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--sunk);color:var(--ink);white-space:nowrap}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%;padding:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.banner{border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--surface);border-radius:8px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.info{border-left-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.chip .next{font-size:.7rem;font-weight:700;color:var(--accent);margin-left:6px;text-transform:uppercase;letter-spacing:.06em}
.chip[aria-pressed="true"] .next{color:var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-head h3{min-width:0}
.target{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.prompt{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:8px;background:var(--sunk)}
.prompt b{white-space:nowrap}
.prompt.up{background:var(--good-soft)} .prompt.up b{color:var(--good)}
.prompt.down{background:var(--bad-soft)} .prompt.down b{color:var(--bad)}
.prompt.hold b{color:var(--ink)}
.prompt.info b,.prompt.new b{color:var(--accent)}
.prompt.deload{background:var(--warn-soft)} .prompt.deload b{color:var(--warn)}
.prompt .kg{font-family:var(--mono);font-weight:600;margin-left:auto;white-space:nowrap}
.prompt-body{min-width:0;font-size:.88rem}
.plates{display:flex;align-items:center;gap:2px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
.plate{display:inline-block;width:9px;border-radius:2px;border:1px solid rgba(0,0,0,.25)}
.sets{display:grid;grid-template-columns:2.2rem 1fr 1fr 1fr;gap:6px;align-items:center}
.sets input::placeholder{color:var(--muted);opacity:.45}
.sets .h{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.sets .n{font-family:var(--mono);color:var(--muted);font-size:.85rem}
.sets input{width:100%;min-width:0;padding:9px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:1rem;text-align:center}
.sets input:focus{border-color:var(--accent);outline:none}
.x{border:0;background:none;color:var(--muted);font-size:1.2rem;line-height:1;padding:6px}
.x:hover{color:var(--bad)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0;align-self:flex-start}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:680px}
nav.tabs button{border:0;background:none;color:var(--muted);padding:12px 4px 10px;font-family:var(--display);font-size:1.05rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-top:3px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}
@media (max-width:400px){nav.tabs button{font-size:.92rem;letter-spacing:.02em;padding-inline:2px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.25);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:30;width:max-content;max-width:calc(100% - 32px)}
.field{display:flex;flex-direction:column;gap:8px}
.field > label,.legend{font-weight:600}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0}
.opt span{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;height:100%}
.opt span small{color:var(--muted);font-size:.8rem}
.opt input:checked + span{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.opt input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.day{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.day ol{margin:0;padding-left:1.3rem;display:flex;flex-direction:column;gap:3px}
.day li span{font-family:var(--mono);font-size:.82rem;color:var(--muted);margin-left:6px;white-space:nowrap}
.swap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.swap select{width:100%}
@media (max-width:460px){.swap{grid-template-columns:1fr;gap:3px}}
.lock{max-width:360px;margin:8px auto 0;display:flex;flex-direction:column;gap:14px;text-align:center}
.pin{font-family:var(--mono);font-size:1.6rem;letter-spacing:.5em;text-align:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%}
.pin:focus{border-color:var(--accent);outline:none}
.textin{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);max-width:320px;width:100%}
.plan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.plan-grid select,.plan-grid input{width:100%}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.linkbtn.rec{font-size:.85rem;padding:2px 0;text-align:left}
.sets .n.is-pr{color:var(--accent-ink);background:var(--accent);border-radius:5px;text-align:center;font-weight:700;font-size:.72rem;padding:3px 0}
@media (prefers-reduced-motion: no-preference){.sets .n.is-pr{animation:pop .35s ease-out}@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}}
.summary h1.big{font-size:2.6rem;line-height:1}
.streak{font-family:var(--display);font-size:1.3rem;font-weight:700;color:var(--good);text-transform:uppercase;letter-spacing:.02em}
.statrow{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.statrow > div{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.statrow .num{font-size:1.5rem;font-weight:600}
.pr{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:var(--r);padding:12px 14px}
.pr > div:first-child{display:flex;flex-direction:column;min-width:0}
.pr strong{font-family:var(--display);font-size:1.3rem;text-transform:uppercase;letter-spacing:.01em}
.pr-val{display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.pr-val .num{font-size:1.1rem;font-weight:600}
.pr .gain{color:var(--good);font-size:.9rem}
.pr.mile{border-left-color:var(--p15)}
.goal{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.gtrack{position:relative;height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.gfill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:6px}
.ghalf{position:absolute;left:50%;top:0;bottom:0;border-left:2px solid var(--surface)}
/* 16px stops iOS zooming the page when a field is focused */
.sets input,.textin,select,.plan-grid input{font-size:16px}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
.last{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:.88rem}
.timer{position:fixed;left:0;right:0;bottom:calc(52px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--ink);color:var(--bg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.timer .tin{max-width:680px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:8px}
.timer .eyebrow{color:var(--bg);opacity:.75}
.timer .tin > .stack{overflow:hidden}
.timer #tLabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer .btn{white-space:nowrap}
.timer .tnum{font-size:1.6rem;font-weight:600;line-height:1.1}
.timer .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.timer .tbar{height:3px;background:var(--accent);width:0}
.timer.done{background:var(--good)}
details.why{border-top:1px solid var(--line);padding-top:8px;font-size:.88rem}
details.why summary{cursor:pointer;color:var(--accent);font-weight:600}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:11px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:6.2rem 1fr 3rem;gap:10px;align-items:center;font-size:.9rem}
.track{position:relative;height:14px;background:var(--sunk);border-radius:4px;overflow:hidden}
.band{position:absolute;top:0;bottom:0;background:var(--good-soft);border-left:1px dashed var(--good);border-right:1px dashed var(--good)}
.fill{position:absolute;left:0;top:3px;bottom:3px;background:var(--accent);border-radius:3px}
.hist-item{border-top:1px solid var(--line);padding-block:12px;display:flex;flex-direction:column;gap:6px}
.hist-item ul{margin:0;padding-left:1.1rem;font-size:.88rem;color:var(--muted)}
select{font:inherit;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
.legend-row{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.sw{display:inline-block;width:12px;height:10px;border-radius:2px;vertical-align:middle;margin-right:5px}
@media (prefers-reduced-motion: no-preference){.btn,.chip,.opt span{transition:border-color .15s,background .15s}}
</style>
<script>
/* Rep Ledger standalone: keeps all data on this device (localStorage), one key per record. */
(function(){
  const PRE="rl:db:";
  const read=p=>{try{const v=localStorage.getItem(PRE+p);return v==null?undefined:JSON.parse(v)}catch(e){return undefined}};
  const has=p=>{try{return localStorage.getItem(PRE+p)!=null}catch(e){return false}};
  const write=(p,d)=>{try{localStorage.setItem(PRE+p,JSON.stringify(d))}catch(e){throw {code:"quota_exceeded",message:"Device storage is full"}}};
  const paths=()=>{const out=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(PRE))out.push(k.slice(PRE.length))}}catch(e){}return out.sort()};
  const freeze=o=>{if(o&&typeof o==="object"){Object.freeze(o);Object.values(o).forEach(freeze)}return o};
  const listeners=new Set();let queued=false;
  const notify=()=>{if(queued)return;queued=true;setTimeout(()=>{queued=false;listeners.forEach(l=>{try{l()}catch(e){console.error(e)}})},0)};
  window.addEventListener("storage",e=>{if(e.key&&e.key.startsWith(PRE))notify()});
  const segOk=p=>p.split("/").every(s=>/^[A-Za-z0-9_\-.~:@+]+$/.test(s)&&s!=="."&&s!=="..");
  const meta={fromCache:false,hasPendingWrites:false};
  const newId=()=>"d"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  function merge(a,b){const o=Object.assign({},a);for(const k of Object.keys(b)){const v=b[k];if(v&&typeof v==="object"&&!Array.isArray(v)&&o[k]&&typeof o[k]==="object"&&!Array.isArray(o[k]))o[k]=merge(o[k],v);else o[k]=v}return o}
  function docRef(path){
    const segs=path.split("/");if(segs.length%2||!segOk(path))throw new TypeError("Bad record path: "+path);
    const id=segs[segs.length-1];
    const snap=()=>{const d=read(path);return {id,exists:d!==undefined,data:()=>d===undefined?undefined:freeze(d),metadata:meta}};
    return {id,path,
      get:async()=>snap(),
      set:async d=>{if(!d||typeof d!=="object"||Array.isArray(d))throw {code:"invalid_argument"};write(path,d);notify()},
      update:async d=>{const cur=read(path);if(cur===undefined)throw {code:"invalid_argument"};write(path,merge(cur,JSON.parse(JSON.stringify(d))));notify()},
      delete:async()=>{try{localStorage.removeItem(PRE+path)}catch(e){}notify()},
      onSnapshot:next=>{const l=()=>next(snap());listeners.add(l);setTimeout(l,0);return()=>listeners.delete(l)},
      collection:sub=>colRef(path+"/"+sub)};
  }
  function colRef(path,q){
    const segs=path.split("/");if(segs.length%2===0||!segOk(path))throw new TypeError("Bad collection path: "+path);
    q=q||{w:[],o:null,l:null};
    const run=()=>{
      let ds=paths().filter(p=>p.startsWith(path+"/")&&p.split("/").length===segs.length+1).map(p=>({p,d:read(p)})).filter(x=>x.d!==undefined);
      for(const [f,op,v] of q.w)if(op==="==")ds=ds.filter(x=>x.d[f]===v);
      if(q.o){const [f,dir]=q.o;ds.sort((a,b)=>(a.d[f]>b.d[f]?1:a.d[f]<b.d[f]?-1:0)*(dir==="desc"?-1:1))}
      if(q.l)ds=ds.slice(0,q.l);
      const docs=ds.map(x=>{const d=freeze(x.d);return {id:x.p.split("/").pop(),exists:true,data:()=>d,metadata:meta}});
      return {docs,size:docs.length,empty:!docs.length,metadata:meta};
    };
    return {path,
      where:(f,op,v)=>colRef(path,{w:q.w.concat([[f,op,v]]),o:q.o,l:q.l}),
      orderBy:(f,dir)=>colRef(path,{w:q.w,o:[f,dir||"asc"],l:q.l}),
      limit:n=>colRef(path,{w:q.w,o:q.o,l:n}),
      get:async()=>run(),
      onSnapshot:next=>{const l=()=>next(run());listeners.add(l);setTimeout(l,0);return()=>listeners.delete(l)},
      doc:id=>docRef(path+"/"+(id||newId())),
      add:async d=>{const r=docRef(path+"/"+newId());await r.set(d);return r}};
  }
  /* Saving a file: the share sheet on phones (Save to Files), a normal download elsewhere */
  async function save({filename,data}){
    const type=/\.json$/.test(filename)?"application/json":/\.csv$/.test(filename)?"text/csv":"text/plain";
    try{
      const file=new File([data],filename,{type});
      if(navigator.canShare&&navigator.canShare({files:[file]})&&/Android|iPhone|iPad/i.test(navigator.userAgent)){await navigator.share({files:[file],title:filename});return}
    }catch(e){if(e&&e.name==="AbortError")throw {code:"declined"}}
    const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
  }
  const caps={db:{doc:docRef,collection:p=>colRef(p)},user:{id:async()=>"local",isOwner:()=>true},downloads:{save}};
  window.claude={local:true,use:async n=>caps[n]||null};
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
})();
</script>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div>
      <h1>Rep Ledger</h1>
    </div>
    <div class="status" id="status"></div>
  </header>
  <div class="chips" id="lifters" role="group" aria-label="Who is training" hidden style="margin-bottom:18px"></div>
  <main id="main"><div class="empty">Loading your programme…</div></main>
</div>

function weekInfo(p){

  let sets=slot.sets,lo=slot.lo,hi=slot.hi,rir,pct=null,planned=false;
  if(p.goal==="size"){
    const w=wi.wk; let r=w<=1?(comp?3:2):w<=3?(comp?2:1):(comp?1:0);
    if(beg){r+=1; if(sets>=3)sets-=1;}
    rir=[r,r];
  }else if(slot.main){
    if(wi.wave){const W=WAVE[wi.wave];lo=hi=W.reps;pct=W.pct;rir=[W.rir,W.rir];if(wi.wave===4){sets=Math.max(2,Math.ceil(sets/2));planned=true}}
    else{lo=hi=slot.hi;rir=[2,2]}
  }else{
    rir=comp?[2,2]:[1,1];
    if(wi.wave===4){sets=Math.max(2,Math.ceil(sets/2));planned=true}
  }
  if(wi.deload){sets=Math.max(1,Math.ceil(sets/2));rir=[3,4];pct=null}
  const rest=slot.main?"3–5 min":comp?"2–3 min":"1.5–2 min";
  if(slot.busy&&p.goal==="size"&&!wi.deload)rir=comp?[1,1]:[0,0];
  return {sets,lo,hi,rir,pct,rest:slot.pair?"60–90 s between pairs":rest,planned};
}
const rirLabel=r=>r[0]===r[1]?`RIR ${r[0]}`:`RIR ${r[0]}–${r[1]}`;
const repLabel=t=>t.lo===t.hi?`${t.hi}`:`${t.lo}–${t.hi}`;

function exHist(name){
  const out=[];
  for(const s of S.sessions){const e=(s.entries||[]).find(x=>x.ex===name);if(e&&e.sets&&e.sets.length)out.push({date:s.date,sets:e.sets})}
  return out;
}

function suggest(slot,t,p,wi){
  const L=LIB[slot.ex],h=exHist(slot.ex),last=h[h.length-1];
  const bar=!!L[4],inc=bar?2.5:0.5;
  const step=L[2]==="i"?1:(L[3]==="l"?5:2.5);
  let stall="";
  if(h.length>=4){const es=h.map(r=>bestE1(r.sets));const before=Math.max(...es.slice(0,-3));if(Math.max(...es.slice(-3))<=before)stall="No progress in 3 sessions. Swap the variation or add one weekly set."}
  if(wi.deload||t.planned){
    if(!last)return {cls:"deload",label:"Lighter week",kg:null,note:"Use a comfortable weight and stop 3–4 reps short of failure."};
    return {cls:"deload",label:"Lighter week",kg:rnd(workKg(last.sets)*0.9,inc),note:"About 90% of last time, fewer sets, easy reps."};
  }
  if(t.pct){
    const e=Math.max(0,...h.slice(-3).map(r=>bestE1(r.sets)));
    if(!e)return {cls:"new",label:"No data yet",kg:null,note:`Pick a weight you could lift roughly ${t.hi+2}–${t.hi+4} times. Log your first set and the app sets the weight for the rest, and works from percentages after that.`};
    return {cls:"info",label:`${Math.round(t.pct*100)}% of est. max`,kg:rnd(e*t.pct,inc),note:`Estimated one-rep max ${fmt(rnd(e,0.5))} kg from your recent sets.`,stall};
  }
  if(!last)return {cls:"new",label:"First session",kg:null,note:`Pick a weight you could lift roughly ${t.lo+t.rir[0]}–${t.hi+t.rir[0]} times. Log your first set and the app sets the weight for the rest.`};
  const mk=workKg(last.sets),top=last.sets.filter(s=>s.kg===mk);
  if(top.every(s=>s.reps>=t.hi))return {cls:"up",label:`Add ${fmt(step)} kg`,kg:rnd(mk+step,inc),note:"You reached the top of the rep range on every set last time.",stall:""};
  if(top.some(s=>s.reps<t.lo)){
    const prev=h[h.length-2];
    const missedBefore=prev&&workKg(prev.sets)===mk&&prev.sets.some(s=>s.kg===mk&&s.reps<t.lo);
    if(t.lo===t.hi&&!missedBefore)return {cls:"hold",label:`Hold ${fmt(mk)} kg`,kg:mk,note:"Missed reps once. Repeat the weight before dropping it.",stall};
    return {cls:"down",label:"Drop the weight",kg:rnd(mk*0.92,inc),note:"You fell short of the rep range. Drop about 8% and build back up.",stall};
  }
  return {cls:"hold",label:`Hold ${fmt(mk)} kg`,kg:mk,note:"Beat last time’s reps before adding weight.",stall};
}

function fatigue(){
  const names=new Set();S.sessions.forEach(s=>(s.entries||[]).forEach(e=>names.add(e.ex)));
  let n=0;
  for(const name of names){const h=exHist(name);if(h.length<3)continue;const es=h.map(r=>bestE1(r.sets));const prior=Math.max(...es.slice(0,-2));if(es[es.length-1]<prior*0.98&&es[es.length-2]<prior*0.98)n++}
  return n>=2;
}
function deloadAdvice(p,wi){
  if(wi.deload||wi.wave)return null;
  if(fatigue())return "Performance has dropped on two or more lifts for two sessions in a row.";
  const fb=S.sessions.filter(x=>x.feedback).slice(-2);
  if(fb.length===2&&fb.every(x=>Object.values(x.feedback).filter(a=>a.rec==="sore"||a.load==="hard").length>=2))return "Your last two check-ins show several muscles still sore or overloaded.";
  if(p.goal==="size"&&p.level!=="beginner"&&wi.wk>=7)return `You're in week ${wi.wk} of this block. A lighter week now will help you keep progressing.`;
  return null;
}

function plates(kg){
  if(kg<20)return "";
  let side=(kg-20)/2;const P=[[25,"--p25"],[20,"--p20"],[15,"--p15"],[10,"--p10"],[5,"--p5"],[2.5,"--p25s"],[1.25,"--p125"]];
  const out=[];for(const [w,c] of P){while(side>=w-1e-9){out.push([w,c]);side-=w}}
  if(!out.length)return `<div class="plates">Empty bar (20 kg)</div>`;
  const hts={25:22,20:22,15:19,10:16,5:13,2.5:11,1.25:9};
  return `<div class="plates" aria-label="Plates per side">${out.map(([w,c])=>`<span class="plate" style="height:${hts[w]}px;background:var(${c})" title="${w} kg"></span>`).join("")}<span style="margin-left:6px">${out.map(x=>x[0]).join(" + ")} kg each side</span></div>`;
}

function renderStatus(){
  const st=$("#status");const p=S.profile;
  if(!p||S.adding){st.innerHTML="";renderLifters();return}
  const wi=weekInfo(p);
  let h=`<span class="pill">${p.goal==="size"?"Size":"Strength"} · ${p.days} days</span>`;
  if(wi.deload)h+=`<span class="pill warn">Deload week</span>`;

  else if(wi.wave)h+=`<span class="pill accent">Wave week ${wi.wave} of 4</span>`;
  else h+=`<span class="pill accent">Block week ${wi.wk}</span>`;

function renderLifters(){

function render(force){
  syncCustom(S.profile);
  renderStatus();
  const main=$("#main");const tabs=$("#tabs");
  if(S.status==="loading"){main.innerHTML=`<div class="empty">${S.slow?"Still trying to reach your saved training. Check your signal; this page will update as soon as it connects.":"Loading your programme…"}</div>`;tabs.hidden=true;return}
  if(S.status==="error"){main.innerHTML=`<div class="empty">Couldn't load your saved training. Close the app and open it again.</div>`;tabs.hidden=true;return}
  if(S.status==="nodb"){main.innerHTML=`<div class="empty stack" style="text-align:left"><h2>Sign in to save training</h2><p>Rep Ledger keeps each person's programme and logs privately in their own account. Open it while signed in to claude.ai to get started.</p></div>`;tabs.hidden=true;return}
  if(S.profile&&S.lid)maybeActivate();
  if(S.lockFor&&!S.adding){tabs.hidden=true;main.innerHTML=lockHTML();bindLock();return}
  if(!S.profile||S.editing||S.adding){tabs.hidden=true;main.innerHTML=builderHTML();bindBuilder();return}
  tabs.hidden=false;
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===S.tab?"page":"false"));
  if(S.tab==="today"&&S.summary){main.innerHTML=summaryHTML();$("#sumNext").onclick=()=>{S.summary=null;render(true);window.scrollTo(0,0)}}
  else if(S.tab==="today"&&S.feedback){main.innerHTML=feedbackHTML();bindFeedback()}

    if(!force&&main.contains(document.activeElement)&&document.activeElement.tagName==="INPUT")return;
    main.innerHTML=todayHTML();if(S.sessLoaded)bindToday();
  }
  else if(S.tab==="plan"){main.innerHTML=planHTML();bindPlan()}
  else if(S.tab==="progress"){main.innerHTML=progressHTML();bindProgress()}
  else {main.innerHTML=historyHTML()+dataHTML();bindHistory();bindData()}
}

function bindBuilder(){
  bindData();
  document.querySelectorAll('input[name="goal"]').forEach(i=>i.onchange=()=>{S.bGoal=i.value;render()});
  document.querySelectorAll('input[name="days"]').forEach(i=>i.onchange=()=>{S.bDays=+i.value;render()});
  document.querySelectorAll('input[name="level"]').forEach(i=>i.onchange=()=>{S.bLevel=i.value;render()});
  $("#bName").oninput=e=>{S.bName=e.target.value};
  $("#bPin").oninput=e=>{S.bPin=e.target.value.replace(/\D/g,"");if(e.target.value!==S.bPin)e.target.value=S.bPin};
  if(S.pinOnly){$("#bPin").focus();S.pinOnly=false}
  const c=$("#cancelEdit");if(c)c.onclick=()=>{S.editing=false;S.adding=false;S.bName=null;S.bPin="";render()};
  $("#create").onclick=async()=>{
    if(S.saving)return;
    const name=(S.bName||"").trim();
    const isNew=!S.profile||S.adding;
    const old=isNew?null:S.profile;
    const pin=S.bPin||"";
    if(!name){toast("Add a name so you can tell people apart");$("#bName").focus();return}
    if((isNew||!old.pinHash||pin)&&!/^\d{4,8}$/.test(pin)){toast("Choose a passcode of 4 to 8 digits");$("#bPin").focus();return}
    const lid=isNew?"lifter-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6):S.lid;
    const sameShape=old&&old.goal===S.bGoal&&old.days===S.bDays&&old.level===S.bLevel;
    let p;
    if(sameShape)p=Object.assign({},old,{name});
    else p=Object.assign({},old||{},{kind:"lifter",name,goal:S.bGoal,days:S.bDays,level:S.bLevel,createdAt:new Date().toISOString(),blockStart:isoDay(new Date()),deloadStart:null,swaps:(old&&old.goal===S.bGoal&&old.days===S.bDays)?(old.swaps||{}):{},blocks:old?archiveBlocks(old):[],volAdj:{},jointFlags:{},schedule:old&&old.days===S.bDays?(old.schedule||null):null,busyUntil:null,v:1});
    if(pin){const salt=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,"0")).join("");p.pinSalt=salt;p.pinHash=await hashPin(pin,salt)}

    }catch(e){handleWriteError(e)}
    S.saving=false;render(true);
  };
}

function nextDayIdx(){
  const prog=programme(S.profile);const id=progId(S.profile);
  const mine=S.sessions.filter(s=>s.prog===id);
  if(!mine.length)return 0;
  return ((mine[mine.length-1].day|0)+1)%prog.length;
}

function ensureDraft(){
  const p=S.profile,prog=programme(p),wi=weekInfo(p);
  if(S.dayIdx==null||S.dayIdx>=prog.length)S.dayIdx=nextDayIdx();
  const key=`rl:${S.uid}:${S.lid}:${progId(p)}:${S.dayIdx}`;
  if(draft&&draft.key===key)return;
  const saved=ls(key);
  const d=prog[S.dayIdx];
  const fresh=saved&&saved.ts&&Date.now()-saved.ts<18*3600e3;
  if(fresh&&saved.entries&&d.ex.every((s,i)=>saved.entries[i]&&saved.entries[i].ex===s.ex)){draft={key,entries:saved.entries,startedAt:saved.startedAt||null,sid:saved.sid||newSid(),ts:saved.ts};return}
  if(saved)ls(key,null);
  draft={key,sid:newSid(),entries:d.ex.map(slot=>freshEntry(slot,p,wi))};
}
function freshEntry(slot,p,wi){const t=adjT(target(slot,p,wi)),sg=adjS(suggest(slot,t,p,wi),LIB[slot.ex]);return {ex:slot.ex,extra:!!slot.extra,sets:Array.from({length:t.sets},()=>({kg:sg.kg!=null?fmt(sg.kg):"",reps:"",rir:""}))}}
function daySlots(day){return day.ex.concat(draft.entries.slice(day.ex.length).map(e=>slotFor(e.ex)))}
const newSid=()=>"s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function saveDraft(){if(draft){draft.ts=Date.now();ls(draft.key,{entries:draft.entries,startedAt:draft.startedAt||null,sid:draft.sid,ts:draft.ts})}}

/* ---------- Rewards: personal bests, milestones, streaks ---------- */
const SESSION_MILESTONES=[1,5,10,25,50,100,150,200,300,500];
function priorBest(ex,before){
  const h=before.map(s=>(s.entries||[]).find(x=>x.ex===ex)).filter(Boolean);
  if(!h.length)return null;
  return {e1:Math.max(0,...h.map(x=>bestE1(x.sets))),kg:Math.max(0,...h.map(x=>maxKg(x.sets))),h};
}
function isPRSet(ex,set){
  const kg=numv(set.kg),reps=parseInt(set.reps);if(!(kg>0&&reps>0))return false;
  const b=priorBest(ex,S.sessions);if(!b)return false;
  const e=e1({kg,reps,rir:set.rir===""?0:set.rir});
  return kg>b.kg||e>b.e1*1.005;
}
function prsFor(entries,before){
  const out=[],miles=[];
  for(const e of entries){
    const b=priorBest(e.ex,before),nowKg=maxKg(e.sets),nowE1=bestE1(e.sets);
    if(!b)continue;
    if(nowKg>b.kg){out.push({ex:e.ex,type:"Heaviest weight",val:`${fmt(nowKg)} kg`,gain:`+${fmt(nowKg-b.kg)} kg`});continue}
    let rep=null;
    for(const st of e.sets){
      const prev=Math.max(0,...b.h.flatMap(x=>x.sets.filter(y=>y.kg===st.kg).map(y=>y.reps)));
      if(prev&&st.reps>prev&&(!rep||st.reps-prev>rep.d))rep={st,d:st.reps-prev};
    }
    if(rep)out.push({ex:e.ex,type:"Rep best",val:`${fmt(rep.st.kg)} kg × ${rep.st.reps}`,gain:`+${rep.d} rep${rep.d>1?"s":""}`});
    else if(nowE1>b.e1*1.005)out.push({ex:e.ex,type:"Estimated max",val:`${fmt(rnd(nowE1,0.5))} kg`,gain:`+${fmt(Math.max(0.5,rnd(nowE1-b.e1,0.5)))} kg`});
  }
  return {prs:out,miles};
}
/* ---------- Personal goals: "lift X kg for N reps", progress measured from where you started ---------- */
const capAt=(e,reps)=>e/(1+reps/30); /* what an estimated max says you can lift for N reps */
function currentCap(ex,reps,sessions){const h=(sessions||S.sessions).map(s=>(s.entries||[]).find(x=>x.ex===ex)).filter(Boolean).slice(-3);const e=Math.max(0,...h.map(x=>bestE1(x.sets)));return e?capAt(e,reps):0}
function suggestGoal(ex,reps){const c=currentCap(ex,reps);if(!c)return null;const L=LIB[ex];const inc=L&&L[4]?2.5:1;return Math.max(rnd(c*1.075,inc),rnd(c,inc)+inc)}
function goalProgress(g,cap){if(g.done)return 1;if(g.base==null)return 0;const span=g.kg-g.base;if(span<=0)return cap>=g.kg?1:0;return Math.max(0,Math.min(1,(cap-g.base)/span))}
/* After a session: mark goals hit, or crossed halfway */
function evalGoals(goals,entries,all){
  const miles=[];let changed=false;
  const next=(goals||[]).map(g=>{
    if(g.done)return g;
    const e=entries.find(x=>x.ex===g.ex);if(!e)return g;
    const capNow=currentCap(g.ex,g.reps,all);
    if(g.base==null&&capNow){g=Object.assign({},g,{base:Math.round(Math.min(capNow,g.kg*0.97)*10)/10});changed=true}
    const hit=e.sets.some(x=>x.kg>=g.kg&&x.reps>=g.reps);

/* ---------- Mesocycles: finished blocks are archived on the lifter, sessions stay put ---------- */
function archiveBlocks(p){
  const b={goal:p.goal,days:p.days,level:p.level,swaps:p.swaps||{},priorities:p.priorities||[],start:p.createdAt,end:new Date().toISOString()};
  return (p.blocks||[]).concat([b]).slice(-40);
}
function blockLabel(b){return `${b.goal==="size"?"Size":"Strength"} · ${b.days} days · ${LEVEL[b.level]}${(b.priorities||[]).length?` · Focus: ${b.priorities.map(m=>MLABEL[m]).join(", ")}`:""}`}
function blockStats(b,end){
  const from=new Date(b.start).getTime(),to=end?new Date(end).getTime():Infinity;
  const ss=S.sessions.filter(s=>{const t=new Date(s.date).getTime();return t>=from&&t<to});
  const lead=programme({goal:b.goal,days:b.days,swaps:b.swaps})[0].ex[0].ex;
  const es=ss.map(s=>(s.entries||[]).find(e=>e.ex===lead)).filter(Boolean).map(e=>bestE1(e.sets)).filter(v=>v>0);
  return {n:ss.length,lead,from:es[0],to:es[es.length-1]};
}
/* A block that starts on a given day: archives the current one (ending that day) and takes the new settings */
function blockFrom(old,src,startDay){
  const startISO=new Date(startDay+"T00:00:00").toISOString();
  const arch=archiveBlocks(old);arch[arch.length-1].end=startISO;
  return Object.assign({},old,{goal:src.goal,days:src.days,level:src.level,swaps:Object.assign({},src.swaps||{}),priorities:(src.priorities||[]).slice(),createdAt:startISO,blockStart:startDay,deloadStart:null,blocks:arch,volAdj:{},jointFlags:{}});
}
/* Planned blocks whose start date has arrived become the current block */
async function maybeActivate(){
  const p=S.profile;if(!p||!S.lid||S.activating||S.activateFailed||S.readOnly)return;
  const today=isoDay(new Date());
  const due=(p.planned||[]).filter(x=>x.start<=today).sort((a,b)=>a.start.localeCompare(b.start));
  if(!due.length)return;
  S.activating=true;
  let cur=p;for(const pl of due)cur=blockFrom(cur,pl,pl.start);
  cur.planned=(p.planned||[]).filter(x=>x.start>today);
  try{await profileRef().set(cur);S.profile=cur;draft=null;S.dayIdx=null;toast("Your planned block has started. Week 1 begins today")}
  catch(e){S.activateFailed=true}
  S.activating=false;render(true);
}

}

function weekSets(){

  S.sessions.filter(s=>new Date(s.date).getTime()>=start).forEach(s=>(s.entries||[]).forEach(e=>{const L=LIB[e.ex];if(!L)return;const n=e.sets.length;tot[L[0]]+=n;L[1].forEach(m=>tot[m]+=n*0.5)}));
  return tot;
}
function niceTicks(lo,hi,n){const raw=(hi-lo)/n;const mag=10**Math.floor(Math.log10(raw));const f=raw/mag;const step=(f<1.5?1:f<3?2:f<7?5:10)*mag;const a=Math.floor(lo/step)*step,b=Math.ceil(hi/step)*step;const t=[];for(let v=a;v<=b+1e-9;v+=step)t.push(+v.toFixed(4));return t}

  const area=pts.length>1?`${line}L${x(pts.length-1).toFixed(1)},${y(lo)}L${x(0).toFixed(1)},${y(lo)}Z`:"";
  const lastP=pts[pts.length-1];

   ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end">${fmt(t)}</text>`).join("")}
   ${area?`<path d="${area}" fill="var(--accent-soft)" opacity=".8"/>`:""}
   <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
   ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===pts.length-1?4:2.5}" fill="${i===pts.length-1?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="2"/>`).join("")}
   <text x="${x(pts.length-1)}" y="${Math.max(11,y(lastP.v)-8)}" text-anchor="end" style="fill:var(--ink);font-weight:600">${fmt(Math.round(lastP.v*10)/10)} ${unit}</text>
   <text x="${pl}" y="${H-6}" text-anchor="start">${new Date(pts[0].d).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</text>
   ${pts.length>1?`<text x="${W-pr}" y="${H-6}" text-anchor="end">${new Date(lastP.d).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</text>`:""}
  </svg>`;
}
function progressHTML(){
  const p=S.profile;const names=[];S.sessions.forEach(s=>(s.entries||[]).forEach(e=>{if(!names.includes(e.ex))names.push(e.ex)}));
  const ws=weekSets();const band=p.goal==="size"?BAND[p.level]:null;
  const max=Math.max(band?band[1]+((p.priorities||[]).length?8:4):12,...Object.values(ws))+1;
  let h=`<div class="stack"><h2>Progress</h2>${goalsHTML(p)}${bodyHTML(p)}`;
  if(!names.length){h+=`<div class="empty">Log your first session and your estimated one-rep max for each exercise will chart here.</div>`}
  else{
    if(!S.progressEx||!names.includes(S.progressEx)){const main=programme(p).flatMap(d=>d.ex).find(s=>names.includes(s.ex));S.progressEx=main?main.ex:names[0]}
    const pts=exHist(S.progressEx).map(r=>({d:r.date,v:bestE1(r.sets)})).filter(x=>x.v>0);
    const first=pts[0],last=pts[pts.length-1];const ch=pts.length>1?((last.v-first.v)/first.v*100):0;
    h+=`<div class="card"><div class="row" style="justify-content:space-between"><label for="exSel" class="eyebrow">Estimated one-rep max</label>
      <select id="exSel">${names.map(n=>`<option ${n===S.progressEx?"selected":""}>${esc(n)}</option>`).join("")}</select></div>
      ${pts.length?lineChart(pts):`<p class="muted">No sets logged for this exercise yet.</p>`}
      ${pts.length>1?`<p class="muted" style="font-size:.85rem">${ch>=0?"Up":"Down"} <span class="num">${fmt(Math.abs(Math.round(ch*10)/10))}%</span> across ${pts.length} sessions. Estimated from your best set each session, counting reps in reserve.</p>`:""}
    </div>`;
  }
  h+=`<div class="card"><div class="eyebrow">Hard sets this week (since Monday)</div>
    ${band?`<div class="legend-row"><span><span class="sw" style="background:var(--accent)"></span>Sets done</span><span><span class="sw" style="background:var(--good-soft);outline:1px dashed var(--good)"></span>Target ${band[0]}–${band[1]} for ${LEVEL[p.level].toLowerCase()}s</span></div>`:`<p class="muted" style="font-size:.85rem">For strength, practice on the main lifts matters more than set totals.</p>`}
    ${(p.priorities||[]).length&&band?`<p class="muted" style="font-size:.82rem">Weak points (*) aim for ${band[1]}–${band[1]+6} sets.</p>`:""}
    <div class="bars">${MUSCLES.map(m=>{const bd=band&&(p.priorities||[]).includes(m)?[band[1],band[1]+6]:band;return `<div class="bar"><span>${MLABEL[m]}${(p.priorities||[]).includes(m)?" *":""}</span><div class="track">${bd?`<div class="band" style="left:${bd[0]/max*100}%;width:${(bd[1]-bd[0])/max*100}%"></div>`:""}<div class="fill" style="width:${Math.min(100,ws[m]/max*100)}%"></div></div><span class="num" style="text-align:right">${fmt(ws[m])}</span></div>`}).join("")}</div>
    <p class="muted" style="font-size:.82rem">Sets where a muscle helps out count as half a set.</p>
  </div></div>`;
  return h;
}
function bindProgress(){bindGoals();bindBody();const s=$("#exSel");if(s)s.onchange=()=>{S.progressEx=s.value;render()}}

function historyHTML(){
  const list=[...S.sessions].reverse();
  if(!list.length)return `<div class="stack"><h2>History</h2><div class="empty">Sessions you save on the Today tab appear here.</div></div>`;
  return `<div class="stack"><div class="row" style="justify-content:space-between"><h2>History</h2>${S.dl?`<button class="btn small" id="exportCsv">Export CSV</button>`:""}</div><div>${list.map(s=>`<div class="hist-item">
    <div class="row" style="justify-content:space-between"><div><strong>${esc(s.dayName||"Session")}</strong> <span class="muted">${niceDate(s.date)}</span>${s.deload?` <span class="pill warn">Lighter</span>`:""}</div>
    ${S.confirmDel===s.id?`<div class="row"><span class="muted" style="font-size:.85rem">Delete this session?</span><button class="btn small danger" data-confirm="${esc(s.id)}">Delete</button><button class="btn small" data-cancel>Keep</button></div>`:`<button class="btn small" data-del-s="${esc(s.id)}">Delete</button>`}</div>
    <ul>${(s.entries||[]).map(e=>`<li>${esc(e.ex)}: <span class="num">${e.sets.map(x=>`${fmt(x.kg)}×${x.reps}`).join(", ")}</span></li>`).join("")}</ul></div>`).join("")}</div></div>`;
}
/* ---------- Backup and restore: everything for every person on this login, as one file ---------- */
async function buildBackup(){
  const out={app:"rep-ledger",v:1,exported:new Date().toISOString(),lifters:[]};
  for(const l of S.lifters){
    const base=S.db.doc(`data/users/${S.uid}/${l.id}`);
    const [ss,ms]=await Promise.all([base.collection("sessions").get(),base.collection("measures").get()]);
    out.lifters.push({id:l.id,data:l.data,sessions:ss.docs.map(d=>({id:d.id,data:d.data()})),measures:ms.docs.map(d=>({id:d.id,data:d.data()}))});
  }
  return out;
}
const idOk=x=>typeof x==="string"&&/^[A-Za-z0-9_\-.~:@+]{1,80}$/.test(x);
function readBackup(text){
  let b;try{b=JSON.parse(text)}catch(e){return null}
  if(!b||b.app!=="rep-ledger"||!Array.isArray(b.lifters))return null;
  const ls=b.lifters.filter(l=>l&&idOk(l.id)&&l.data&&l.data.kind==="lifter");
  if(!ls.length)return null;
  return {lifters:ls,people:ls.length,sessions:ls.reduce((a,l)=>a+(l.sessions||[]).length,0)};
}
async function applyBackup(b){
  for(const l of b.lifters){
    const base=S.db.doc(`data/users/${S.uid}/${l.id}`);
    await base.set(l.data);
    for(const x of (l.sessions||[]))if(idOk(x.id)&&x.data)await base.collection("sessions").doc(x.id).set(x.data);
    for(const x of (l.measures||[]))if(idOk(x.id)&&x.data)await base.collection("measures").doc(x.id).set(x.data);
  }
}
function dataHTML(){
  const r=S.restore;
  return `<div class="card" style="margin-top:16px"><div class="eyebrow">Your data</div>
    <p style="font-size:.9rem">${S.localOnly?"Your training is stored on this device. Download a backup now and then, and use it to move to a new phone.":"Download everything as one file, or restore from a backup made in another copy of the app."}</p>
    ${r?`<div class="banner"><span>${r.busy?"Restoring…":`Restore ${r.people} ${r.people===1?"person":"people"} and ${r.sessions} session${r.sessions===1?"":"s"}? Matching records here are replaced.`}</span>${r.busy?"":`<div class="row"><button class="btn small primary" id="restoreGo">Restore</button><button class="btn small" id="restoreNo">Cancel</button></div>`}</div>`:
    `<div class="row">${S.dl?`<button class="btn small" id="backupBtn">Download backup</button>`:""}<label class="btn small" for="restoreFile">Restore from backup</label><input type="file" id="restoreFile" accept=".json,application/json" hidden></div>`}
  </div>`;
}
function bindData(){
  const bb=$("#backupBtn");if(bb)bb.onclick=async()=>{
    try{const b=await buildBackup();await S.dl.save({filename:`rep-ledger-backup-${isoDay(new Date())}.json`,data:JSON.stringify(b)});ls("rl:lastBackup",Date.now());toast("Backup saved")}
    catch(e){if(!e||e.code!=="declined")toast("Couldn't make the backup. Try again")}
  };
  const rf=$("#restoreFile");if(rf)rf.onchange=async()=>{
    const f=rf.files&&rf.files[0];if(!f)return;
    const b=readBackup(await f.text());
    if(!b){toast("That file isn't a Rep Ledger backup");rf.value="";return}
    S.restore=b;render();
  };
  const no=$("#restoreNo");if(no)no.onclick=()=>{S.restore=null;render()};
  const go=$("#restoreGo");if(go)go.onclick=async()=>{
    const b=S.restore;b.busy=true;render();
    try{await applyBackup(b);S.restore=null;toast(`Restored ${b.sessions} session${b.sessions===1?"":"s"}`)}
    catch(e){S.restore=null;handleWriteError(e)}
    render();
  };
}
function csvCell(v){v=v==null?"":String(v);return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v}
function buildCsv(){
  const rows=[["date","session","block_week","exercise","muscle","set","kg","reps","rir","readiness"]];
  for(const s of S.sessions)for(const e of (s.entries||[]))e.sets.forEach((x,i)=>rows.push([isoDay(s.date),s.dayName||"",s.week||"",e.ex,(LIB[e.ex]&&MLABEL[LIB[e.ex][0]])||"",i+1,x.kg,x.reps,x.rir==null?"":x.rir,s.readiness?s.readiness.level:""]));
  return rows.map(r=>r.map(csvCell).join(",")).join("\n");
}
function bindHistory(){
  const ex=$("#exportCsv");if(ex)ex.onclick=async()=>{
    const name=((S.profile&&S.profile.name)||"training").toLowerCase().replace(/[^a-z0-9]+/g,"-");
    try{await S.dl.save({filename:`rep-ledger-${name}-${isoDay(new Date())}.csv`,data:buildCsv()});toast("Export saved")}
    catch(e){if(e&&e.code!=="declined")toast(e&&e.code==="unavailable"?"Export isn't available here":"Couldn't export. Try again")}
  };
  document.querySelectorAll("[data-del-s]").forEach(b=>b.onclick=()=>{S.confirmDel=b.dataset.delS;render()});
  document.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=()=>{S.confirmDel=null;render()});
  document.querySelectorAll("[data-confirm]").forEach(b=>b.onclick=async()=>{try{await sessionsRef().doc(b.dataset.confirm).delete();toast("Session deleted")}catch(e){handleWriteError(e)}S.confirmDel=null;render()});
}

$("#tMinus").onclick=()=>{if(TM.end){TM.end=Math.max(Date.now(),TM.end-15000);TM.done=false;if(!TM.int)TM.int=setInterval(tick,250);tick()}};
$("#tPlus").onclick=()=>{if(TM.end){TM.end=Math.max(TM.end,Date.now())+15000;TM.dur+=15;TM.done=false;if(!TM.int)TM.int=setInterval(tick,250);tick()}};
$("#tSkip").onclick=stopRest;
$("#main").addEventListener("focusout",()=>{if(S.dirty)setTimeout(()=>{if(S.dirty&&!fieldFocused()){S.dirty=false;render(true)}},80)});
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;S.confirmDel=null;window.scrollTo(0,0);render(true)});

/* ---------- Data ---------- */
const profileRef=()=>S.db.doc(`data/users/${S.uid}/${S.lid}`);
const sessionsRef=()=>profileRef().collection("sessions");
let unsubSessions=null,unsubMeasures=null;
function subMeasures(lid){
  if(unsubMeasures)unsubMeasures();
  S.measures=[];S.sigM=null;
  unsubMeasures=profileRef().collection("measures").onSnapshot(snap=>{
    if(S.lid!==lid)return;
    const list=snap.docs.map(d=>Object.assign({id:d.id},d.data())).filter(m=>m.date).sort((a,b)=>a.date.localeCompare(b.date)),sig=JSON.stringify(list);
    if(sig===S.sigM)return;S.sigM=sig;S.measures=list;
    if(S.tab==="progress")renderData();
  },()=>{});
}
/* Passcodes: salted SHA-256, unlock remembered for this browser tab only */
async function hashPin(pin,salt){
  const txt=`${salt}:${pin}`;
  try{const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt));return Array.from(new Uint8Array(buf),b=>b.toString(16).padStart(2,"0")).join("")}
  catch(e){let h=2166136261;for(const ch of txt){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return "f"+(h>>>0).toString(16)}
}
/* Sign-ins are remembered on this device (localStorage) until "Sign out", or for this tab only (sessionStorage) */
function readSet(store){try{return new Set(JSON.parse(window[store].getItem(`rl:unlocked:${S.uid}`)||"[]"))}catch(e){return new Set()}}
function writeSet(store,s){try{window[store].setItem(`rl:unlocked:${S.uid}`,JSON.stringify([...s]))}catch(e){}}
function markUnlocked(lid,on=true,remember=true){
  S._unl=S._unl||new Set();
  for(const store of ["localStorage","sessionStorage"]){
    const s=readSet(store);
    if(on&&(store==="sessionStorage"||remember))s.add(lid);else if(!on)s.delete(lid);
    writeSet(store,s);
  }
  on?S._unl.add(lid):S._unl.delete(lid);
}
function isUnlocked(lid){return (S._unl&&S._unl.has(lid))||readSet("localStorage").has(lid)||readSet("sessionStorage").has(lid)}
function lockCurrent(){
  if(!S.lid)return;const lid=S.lid;markUnlocked(lid,false);
  if(unsubSessions){unsubSessions();unsubSessions=null}if(unsubMeasures){unsubMeasures();unsubMeasures=null}S.measures=[];
  S.lid=null;S.profile=null;S.sessions=[];draft=null;S.lockFor=lid;S.pinErr="";render(true);
}
function lockHTML(){
  const l=S.lifters.find(x=>x.id===S.lockFor);
  return `<form class="lock" id="lockForm" autocomplete="off">
    <span class="eyebrow">Sign in</span><h2>${esc(l?l.name:"Training")}</h2>
    <label for="pinIn" class="muted">Enter ${esc(l?l.name:"this person")}'s passcode</label>
    <input id="pinIn" class="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
    ${S.pinErr?`<p style="color:var(--bad);font-weight:600" role="alert">${esc(S.pinErr)}</p>`:""}
    <label class="row" style="justify-content:center;gap:8px;font-size:.9rem"><input type="checkbox" id="remember" checked> Stay signed in on this phone</label>
    <button class="btn primary block" type="submit">Sign in</button>
    <p class="muted" style="font-size:.82rem">Passcodes can't be recovered in the app. Pick another person above to switch. Untick "Stay signed in" on a shared phone.</p>
  </form>`;
}
function bindLock(){
  const f=$("#lockForm"),i=$("#pinIn");i.focus();
  f.onsubmit=async e=>{
    e.preventDefault();
    const l=S.lifters.find(x=>x.id===S.lockFor);if(!l)return;
    const ok=(await hashPin(i.value.replace(/\D/g,""),l.data.pinSalt))===l.data.pinHash;
    if(!ok){S.pinErr="That passcode didn't match. Try again.";await new Promise(r=>setTimeout(r,600));render(true);return}
    markUnlocked(l.id,true,$("#remember").checked);S.lockFor=null;S.pinErr="";switchLifter(l.id,l.data);
  };
}
function switchLifter(lid,data){
  if(lid===S.lid&&!S.adding)return;
  const found=S.lifters.find(l=>l.id===lid);
  const info=data||(found?found.data:null);
  S.adding=false;S.editing=false;S.dayIdx=null;draft=null;S.progressEx=null;S.confirmDel=null;S.sessions=[];S.sessLoaded=false;S.sigS=null;S.summary=null;S.feedback=null;
  if(info&&info.pinHash&&!isUnlocked(lid)){
    if(unsubSessions){unsubSessions();unsubSessions=null}if(unsubMeasures){unsubMeasures();unsubMeasures=null}S.measures=[];
    S.lid=null;S.profile=null;S.lockFor=lid;S.pinErr="";render(true);return;
  }
  S.lockFor=null;S.lid=lid;
  S.profile=info;
  ls(`rl:${S.uid}:active`,lid);
  if(unsubSessions)unsubSessions();
  const loadT=setTimeout(()=>{if(S.lid===lid&&!S.sessLoaded){S.sessLoaded=true;S.stale=true;renderData()}},10000);
  unsubSessions=sessionsRef().orderBy("date","asc").onSnapshot(snap=>{
    if(S.lid!==lid)return;
    const list=snap.docs.map(d=>Object.assign({id:d.id},d.data())),sig=JSON.stringify(list);
    if(!snap.metadata.fromCache)clearTimeout(loadT);
    if(S.sessLoaded&&sig===S.sigS)return;
    S.sigS=sig;S.sessions=list;S.sessLoaded=true;
    renderData();
  },()=>{clearTimeout(loadT);S.sessLoaded=true;renderData()});
  subMeasures(lid);
  render(true);
}
function handleWriteError(e){
  const c=e&&e.code;
  if(c==="timeout"){toast("Still trying to save. Check your signal, then try again");return}
  if(c==="invalid_argument"){S.readOnly=true;toast("Couldn't save. You may have view-only access.")}
  else if(c==="quota_exceeded")toast("Storage is full. Delete some old sessions and try again.");
  else toast("Couldn't save. Check your connection and try again.");
}
(async function start(){
  const cl=window.claude;
  if(!cl||!cl.use){S.status="nodb";render();return}
  const [db,user,dl]=await Promise.all([cl.use("db"),cl.use("user"),cl.use("downloads")]);
  S.dl=dl;S.localOnly=!!cl.local;
  const uid=user?await user.id():null;
  if(!db||!uid){S.status="nodb";render();return}
  S.db=db;S.uid=uid;
  let confirmed=false;
  const timer=setTimeout(()=>{if(!confirmed){S.stale=true;S.slow=true;renderData()}},10000);
  S.db.collection(`data/users/${uid}`).where("kind","==","lifter").onSnapshot(snap=>{
    const list=snap.docs.map(d=>({id:d.id,name:d.data().name,data:d.data()})).sort((a,b)=>a.id.localeCompare(b.id));
    const sig=JSON.stringify(list),was=confirmed;
    if(!snap.metadata.fromCache){confirmed=true;clearTimeout(timer);S.stale=false;S.slow=false}
    if(sig===S.sigL&&was===confirmed&&S.status==="ready")return;
    S.sigL=sig;S.lifters=list;
    if(!confirmed&&!S.lifters.length)return;
    S.status="ready";
    if(S.lockFor&&S.lifters.some(l=>l.id===S.lockFor)){renderData();return}
    const cur=S.lifters.find(l=>l.id===S.lid);
    if(cur){S.profile=cur.data;renderData();return}
    const remembered=ls(`rl:${uid}:active`);
    const pick=S.lifters.find(l=>l.id===remembered)||S.lifters[0];
    if(pick)switchLifter(pick.id,pick.data);else{S.lid=null;S.profile=null;renderData()}
  },()=>{clearTimeout(timer);if(S.status!=="ready")S.status="error";renderData()});
})();
</script>
